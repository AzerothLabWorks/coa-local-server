name: ${COMPOSE_PROJECT_NAME:?Set an isolated staging project name}

services:
  database:
    image: ${COA_STAGING_DATABASE_IMAGE:?Set the checkpoint database image}
    restart: "no"
    mem_limit: 2g
    environment:
      MYSQL_ROOT_PASSWORD: ${COA_STAGING_DB_PASSWORD:?Set a separate staging password}
    volumes:
      - staging-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names --execute='SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 60

  authserver:
    image: ${COA_STAGING_AUTH_IMAGE:?Set the checkpoint auth image}
    restart: "no"
    tty: true
    env_file:
      - path: ./authserver.env
        format: raw
    environment:
      AC_LOGIN_DATABASE_INFO: database;3306;root;${COA_STAGING_DB_PASSWORD};acore_auth
      AC_UPDATES_ENABLE_DATABASES: 0
      AC_UPDATES_AUTO_SETUP: 0
    ports:
      - "127.0.0.1:${COA_STAGING_AUTH_PORT:-33725}:3724"
    volumes:
      - ./etc:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
      - staging-ingress

  worldserver:
    image: ${COA_STAGING_WORLD_IMAGE:?Set the checkpoint world image}
    restart: "no"
    mem_limit: 10g
    stdin_open: true
    tty: true
    env_file:
      - path: ./worldserver.env
        format: raw
    environment:
      AC_LOGIN_DATABASE_INFO: database;3306;root;${COA_STAGING_DB_PASSWORD};acore_auth
      AC_WORLD_DATABASE_INFO: database;3306;root;${COA_STAGING_DB_PASSWORD};acore_world
      AC_CHARACTER_DATABASE_INFO: database;3306;root;${COA_STAGING_DB_PASSWORD};acore_characters
      AC_PLAYERBOTS_DATABASE_INFO: database;3306;root;${COA_STAGING_DB_PASSWORD};acore_playerbots
      AC_UPDATES_ENABLE_DATABASES: 0
      AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: 0
      AC_UPDATES_AUTO_SETUP: 0
      AC_REALM_ID: 1
      AC_ASCENSION_COMPAT_ALLOW_REMOTE_CLIENTS: 1
      AC_CO_AGAMEPLAY_TEST_ENABLE: 0
      AC_SOAP_ENABLED: 0
      AC_RA_ENABLE: 0
    ports:
      - "127.0.0.1:${COA_STAGING_WORLD_PORT:-38086}:8085"
      - "127.0.0.1:${COA_STAGING_SOAP_PORT:-37879}:7878"
    volumes:
      - ./etc:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
      - ${COA_STAGING_DATA_DIR:?Set separate checkpoint data}:/azerothcore/env/dist/data:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
      - staging-ingress

volumes:
  staging-database:
    name: ${COMPOSE_PROJECT_NAME}-database

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-network
    internal: true
  staging-ingress:
    name: ${COMPOSE_PROJECT_NAME}-ingress
