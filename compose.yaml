name: ${COMPOSE_PROJECT_NAME:-coa-local}

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: acore_world
    ports:
      - "${COA_DB_PORT:-33306}:3306"
    volumes:
      - coa-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 10s
      retries: 60

  world-bootstrap:
    build:
      context: ${COA_ORCHESTRATION_DIR:?Set COA_ORCHESTRATION_DIR in .env}
      dockerfile: world-bootstrap.Dockerfile
    image: coa-local/world-bootstrap:${COA_IMAGE_TAG:-dev}
    environment:
      COA_DB_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD}
      COA_PLAYERBOTS_ENABLED: ${COA_PLAYERBOTS_ENABLED:-0}
    volumes:
      - ${COA_SOURCE_DIR:?Set COA_SOURCE_DIR in .env}:/coa-source:ro
    depends_on:
      database:
        condition: service_healthy

  db-import:
    build:
      context: ${COA_SOURCE_DIR:?Set COA_SOURCE_DIR in .env}
      dockerfile: apps/docker/Dockerfile
      target: db-import
      args: &build-user
        USER_ID: ${COA_USER_ID:-1000}
        GROUP_ID: ${COA_GROUP_ID:-1000}
        DOCKER_USER: acore
    image: coa-local/db-import:${COA_IMAGE_TAG:-dev}
    environment: &database-environment
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_LOGIN_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD};acore_auth
      AC_WORLD_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD};acore_world
      AC_CHARACTER_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD};acore_characters
      AC_PLAYERBOTS_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD};acore_playerbots
    volumes:
      - coa-etc:/azerothcore/env/dist/etc
      - coa-logs:/azerothcore/env/dist/logs
    depends_on:
      world-bootstrap:
        condition: service_completed_successfully

  playerbots-bootstrap:
    image: coa-local/world-bootstrap:${COA_IMAGE_TAG:-dev}
    entrypoint: ["/usr/local/bin/bootstrap-playerbots"]
    environment:
      COA_DB_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD}
      COA_PLAYERBOTS_ENABLED: ${COA_PLAYERBOTS_ENABLED:-0}
    volumes:
      - ${COA_SOURCE_DIR:?Set COA_SOURCE_DIR in .env}:/coa-source:ro
    depends_on:
      db-import:
        condition: service_completed_successfully

  realm-config:
    image: mysql:8.4
    environment:
      MYSQL_PWD: ${COA_DB_ROOT_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        mysql --host=database --user=root acore_auth
        --execute="INSERT INTO realmlist
        (id, name, address, localAddress, localSubnetMask, port, icon, flag,
        timezone, allowedSecurityLevel, population, gamebuild)
        VALUES (1, 'AzerothCore', '${COA_REALM_ADDRESS:-127.0.0.1}',
        '127.0.0.1', '255.255.255.0', ${COA_WORLD_PORT:-38085}, 0, 0, 1, 0, 0, 12340)
        ON DUPLICATE KEY UPDATE
        name=VALUES(name), address=VALUES(address), localAddress=VALUES(localAddress),
        localSubnetMask=VALUES(localSubnetMask), port=VALUES(port), flag=0,
        gamebuild=VALUES(gamebuild)";
        test "$$(mysql --host=database --user=root acore_auth --batch --skip-column-names
        --execute="SELECT COUNT(*) FROM realmlist WHERE id=1
        AND address='${COA_REALM_ADDRESS:-127.0.0.1}'
        AND port=${COA_WORLD_PORT:-38085} AND flag=0")" = 1
    depends_on:
      playerbots-bootstrap:
        condition: service_completed_successfully

  module-config:
    image: coa-local/worldserver:${COA_IMAGE_TAG:-dev}
    entrypoint: ["/usr/bin/env", "bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /azerothcore/env/dist/etc/modules
        for source in /azerothcore/env/ref/etc/modules/*.conf.dist; do
          target="/azerothcore/env/dist/etc/modules/$$(basename "$${source%.dist}")"
          if [[ ! -e "$$target" ]]; then
            cp "$$source" "$$target"
          fi
        done
    volumes:
      - coa-etc:/azerothcore/env/dist/etc
    depends_on:
      db-import:
        condition: service_completed_successfully

  authserver:
    build:
      context: ${COA_SOURCE_DIR}
      dockerfile: apps/docker/Dockerfile
      target: authserver
      args: *build-user
    image: coa-local/authserver:${COA_IMAGE_TAG:-dev}
    restart: unless-stopped
    tty: true
    environment:
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
      AC_LOGIN_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD};acore_auth
    ports:
      - "${COA_AUTH_PORT:-33724}:3724"
    volumes:
      - coa-etc:/azerothcore/env/dist/etc
      - coa-logs:/azerothcore/env/dist/logs
    depends_on:
      realm-config:
        condition: service_completed_successfully
      module-config:
        condition: service_completed_successfully

  worldserver:
    build:
      context: ${COA_SOURCE_DIR}
      dockerfile: apps/docker/Dockerfile
      target: worldserver
      args: *build-user
    image: coa-local/worldserver:${COA_IMAGE_TAG:-dev}
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      <<: *database-environment
      TZ: ${COA_TIMEZONE:-America/Los_Angeles}
      # Docker bridge traffic arrives from a non-loopback address. This realm is
      # dedicated to the matching Ascension client, whose world headers remain
      # plaintext after authentication.
      AC_ASCENSION_COMPAT_ALLOW_REMOTE_CLIENTS: 1
      AC_ASCENSION_COMPAT_DBC_DIRECTORY: /azerothcore/env/dist/data/dbc/Ascension
      # Module SQL is imported by playerbots-bootstrap because runtime images
      # intentionally do not contain module source trees.
      AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: 0
      # Keep the first COA-aware test pool deliberately small while class spell
      # selection and specialization profiles are validated in live play.
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: 1
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: ${COA_MIN_RANDOM_BOTS:-12}
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: ${COA_MAX_RANDOM_BOTS:-12}
      AC_AI_PLAYERBOT_RANDOM_BOT_ACCOUNT_COUNT: ${COA_RANDOM_BOT_ACCOUNT_COUNT:-120}
      AC_AI_PLAYERBOT_RANDOM_BOT_CUSTOM_CLASSES_ONLY: 1
      # Exact bot name for the opt-in Witch Doctor Brewing healer pilot.
      COA_BREWING_PILOT_NAME: ${COA_BREWING_PILOT_NAME:-}
      AC_DYNAMIC_XP_REMINDER_INTERVAL: ${COA_XP_REMINDER_INTERVAL:-40}
      AC_DYNAMIC_XP_PRESET: ${COA_XP_RATE:-3}
      AC_SKILL_GAIN_CRAFTING: ${COA_PROFESSION_RATE:-4}
      AC_SKILL_GAIN_GATHERING: ${COA_PROFESSION_RATE:-4}
      AC_START_PLAYER_MONEY: ${COA_STARTER_MONEY_COPPER:-50000000}
      AC_CO_AGAMEPLAY_TEST_ENABLE: 0
    ports:
      - "${COA_WORLD_PORT:-38085}:8085"
      - "${COA_SOAP_PORT:-37878}:7878"
    volumes:
      - coa-etc:/azerothcore/env/dist/etc
      - coa-logs:/azerothcore/env/dist/logs
      - ${COA_DATA_DIR:?Set COA_DATA_DIR in .env}:/azerothcore/env/dist/data:ro
    depends_on:
      realm-config:
        condition: service_completed_successfully
      module-config:
        condition: service_completed_successfully

volumes:
  coa-database:
    name: ${COMPOSE_PROJECT_NAME:-coa-local}-database
  coa-etc:
    name: ${COMPOSE_PROJECT_NAME:-coa-local}-etc
  coa-logs:
    name: ${COMPOSE_PROJECT_NAME:-coa-local}-logs
